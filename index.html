    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }

      html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #020308;
        font-family: 'Outfit', sans-serif;
        color: #e0f2fe;
      }

      #webgl-canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        z-index: 1;
        outline: none;
      }

      /* Subtle Vignette ambient overlay */
      .ambient-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 2;
        background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(2, 3, 8, 0.65) 100%);
      }

      /* Top HUD Bar */
      #hud {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        padding: 1.25rem 1.75rem;
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        z-index: 10;
        pointer-events: none;
      }

      .hud-brand {
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
      }

      .brand-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 1.15rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: #ffffff;
        text-shadow: 0 0 16px rgba(0, 240, 255, 0.7), 0 0 32px rgba(0, 240, 255, 0.35);
      }

      .brand-phase {
        font-size: 0.72rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #38bdf8;
        opacity: 0.85;
      }

      .hud-center {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.15rem;
      }

      .score-display {
        font-family: 'Space Grotesk', monospace;
        font-size: 2.75rem;
        font-weight: 700;
        line-height: 1;
        color: #ffffff;
        text-shadow: 0 0 20px rgba(56, 189, 248, 0.8), 0 0 40px rgba(0, 240, 255, 0.4);
        transition: transform 0.1s ease-out;
      }

      .score-display.pulse {
        transform: scale(1.15);
      }

      .combo-tag {
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #f472b6;
        opacity: 0;
        transform: translateY(-4px);
        transition: opacity 0.25s, transform 0.25s;
        text-shadow: 0 0 12px rgba(244, 114, 182, 0.8);
      }

      .combo-tag.active {
        opacity: 1;
        transform: translateY(0);
      }

      .hud-stats {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        pointer-events: auto;
      }

      .stat-pill {
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        margin-right: 0.25rem;
      }

      .stat-label {
        font-size: 0.65rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #94a3b8;
      }

      .stat-value {
        font-family: 'Space Grotesk', monospace;
        font-size: 1.1rem;
        font-weight: 600;
        color: #cbd5e1;
      }

      /* Control action buttons */
      .icon-btn {
        background: rgba(15, 23, 42, 0.65);
        border: 1px solid rgba(56, 189, 248, 0.25);
        color: #e0f2fe;
        width: 38px;
        height: 38px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        outline: none;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      .icon-btn:hover {
        background: rgba(30, 41, 59, 0.85);
        border-color: rgba(56, 189, 248, 0.7);
        box-shadow: 0 0 14px rgba(56, 189, 248, 0.4);
        transform: scale(1.05);
      }

      .icon-btn:active {
        transform: scale(0.95);
      }

      .icon-btn.active {
        border-color: rgba(0, 240, 255, 0.85);
        background: rgba(0, 240, 255, 0.2);
        color: #00f0ff;
        box-shadow: 0 0 14px rgba(0, 240, 255, 0.4);
      }

      /* Touch D-Pad for Mobile & Fold Devices */
      .touch-dpad-container {
        position: absolute;
        bottom: 2rem;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 0.35rem;
        z-index: 30;
        pointer-events: auto;
        touch-action: manipulation;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.25s ease, visibility 0.25s ease, transform 0.25s ease;
      }

      .touch-dpad-container.visible {
        opacity: 1;
        visibility: visible;
      }
